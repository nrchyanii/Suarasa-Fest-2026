            window.addEventListener('hashchange', handleHashChange);
        });

        function handleHashChange() {
            const hash = window.location.hash.replace('#', '');
            if (hash.startsWith('team/')) {
                const id = hash.split('/')[1];
                const exists = TEAMS_DATA.find(t => t.id === id);
                if (exists) {
                    currentState = { view: 'team', teamId: id };
                } else {
                    currentState = { view: 'home', teamId: null };
                }
            } else if (hash === 'about') {
                currentState = { view: 'about', teamId: null };
            } else {
                currentState = { view: 'home', teamId: null };
            }
            renderApp();
        }

        function navigateTo(view, teamId = null) {
            if (view === 'team' && teamId) {
                window.location.hash = `team/${teamId}`;
            } else if (view === 'about') {
                window.location.hash = 'about';
            } else {
                window.location.hash = '';
                currentState = { view: 'home', teamId: null };
                renderApp();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToGallery() {
            if (currentState.view !== 'home') {
                navigateTo('home');
                setTimeout(() => {

                }, 100);
            } else {
                const el = document.getElementById('galeri-karya');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            }

                    if (el) el.scrollIntoView({ behavior: 'smooth' });

            } else {

                if (el) el.scrollIntoView({ behavior: 'smooth' });

            const box = document.getElementById('toast-box');
            const text = document.getElementById('toast-message');
            text.textContent = msg;
            box.classList.remove('hidden');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                box.classList.add('hidden');

        // ==================== INTERAKSI MODAL NASKAH ====================
        function openScriptModal(teamId) {
            const team = TEAMS_DATA.find(t => t.id === teamId);
            if (!team) return;

            document.getElementById('modal-team-name').textContent = `TIM ${team.number} — ${team.name}`;
            document.getElementById('modal-script-title').textContent = `Naskah: “${team.title}”`;
            document.getElementById('modal-script-body').textContent = team.scriptFull;

            const docLink = document.getElementById('modal-doc-link');
            docLink.href = team.scriptDocUrl;
            docLink.onclick = (e) => handleExternalLink(e, team.scriptDocUrl, 'Dokumen eksternal naskah belum ditautkan.');

            document.getElementById('script-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeScriptModal() {
            document.getElementById('script-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function handleWatchPlaceholder(url) {
            if (!url || url === '#') {
                showToast('Video belum diunggah. Pengelola dapat menyematkan tautan embed YouTube/Drive pada data tim.');
            } else {
                window.open(url, '_blank');
            }
        }

        function handleExternalLink(e, url, fallbackMsg) {
            if (!url || url === '#') {
                e.preventDefault();
                showToast(fallbackMsg);
            }
        }
    </script>
